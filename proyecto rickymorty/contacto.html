    <main class="container-fluid main-contact">
       <div class=" main-contact-div d-flex flex-column justify-content-center align-items-center m-auto mt-5 w-75 h-75">
        <h1 class="row colorBLue">Contact</h1>
        <h2 class="row colorBLue">Leave us your information so we can contact you</h2>

        <form class="row colorBLue g-3 p-4">
            <div class="col-md-6">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control p-2" id="name">
            </div>
            <div class="col-md-6">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control p-2" id="email">
            </div>

            <div class="col-md-12">
              <label for="coment" class="form-label">Mesage</label>
              <textarea  class="form-control p-4" id="coment" ></textarea>
            </div>
        

            <div class="col-12">
              <button type="submit" class="btn botones colorW">Sign in</button>
            </div>
          </form>
        </div>
    </main>
