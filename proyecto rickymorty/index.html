<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <title>Proyecto - Rick & Morty</title>
</head>
<body >
    <header class="principal-search container-fluid d-flex flex-column justify-content-center align-items-center">
        <div class="container-header  d-flex flex-column justify-content-center">

            <h1 class="row justify-content-center">Proyecto - Rick & Morty</h1>
    
            <nav class="row navbar align-items-center">
                <ul class="nav nav-pills  justify-content-center">
                    <li class="nav-item">
                    <a class="nav-link active m-2 p-3 botones " href="./personajes.html"> Characters</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link  active m-2 p-3 botones" href="./contacto.html">  Contact</a>
                    </li>
                </ul>
            </nav>            
        </div>
          
    </header>
    <main class="container">
        <section class="row section-filters py-5">
            <h2>Filters</h2>
            <div class="filters d-flex justify-content-between flex-wrap">
                <div class="form-check form-switch px-5 py-2">
                    <input class="form-check-input" type="checkbox" role="switch" id="Alive" onchange="filterCh(event)">
                    <label class="form-check-label" for="Alive">Character Alive</label>
                </div>
                <div class="form-check form-switch px-5 py-2">
                    <input class="form-check-input" type="checkbox" role="switch" id="Dead" onchange="filterCh(event)">
                    <label class="form-check-label" for="Dead">Character Dead</label>
                </div>
                <div class="form-check form-switch px-5 py-2">
                    <input class="form-check-input" type="checkbox" role="switch" id="Male" onchange="filterCh(event)">
                    <label class="form-check-label" for="Male">Male</label>
                </div>
                <div class="form-check form-switch px-5 py-2">
                    <input class="form-check-input" type="checkbox" role="switch" id="Female" onchange="filterCh(event)">
                    <label class="form-check-label" for="Female">Female</label>
                </div>
                <div class="form-check form-switch px-5 py-2">
                    <input class="form-check-input" type="checkbox" role="switch" id="unknown" onchange="filterCh(event)">
                    <label class="form-check-label" for="unknown">Origin Unknown </label>
                </div>                
            </div>
           
            
        </section>
        <section class="row cards-section"> 

        </section>
    </main>
    <script src="./script.js"></script>
  
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js" integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V" crossorigin="anonymous"></script>


</body>
</html>
